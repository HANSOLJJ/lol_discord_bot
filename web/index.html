<!doctype html>
<html lang="ko">
<!--
  투기장 시즌 전적 대시보드 (단일 파일, 정적)
  - history_data.json을 fetch로 읽어 브라우저에서 전부 동적 계산
  - 탭: 개인 / 2인·3인 시너지 / 챔피언 / 3:3 매치업, 기간(시즌·세션)·인원·최소판수 필터
  - 외부 의존성은 CDN 둘뿐: Pretendard 웹폰트(jsDelivr, 실패 시 시스템 폰트)·챔프 초상화(Data Dragon, 실패해도 텍스트로 동작)
  - 데이터 갱신은 봇(game_recorder)이 history_data.json을 재생성/업로드
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏟️</text></svg>" />
<title>투기장 시즌 전적 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1d212b; --border: #262b36;
    --text: #e6e9ef; --muted: #8b93a7; --accent: #5b8cff;
    --win: #3fb950; --loss: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard Variable", "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  button, input, select, textarea { font-family: inherit; }
  input[type=range] { min-height: 24px; }
  button { line-height: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .sub b { color: var(--text); }

  .controls {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
  }
  .controls label { color: var(--muted); font-size: 13px; margin-right: 6px; }
  .controls select, .controls input[type=range] { vertical-align: middle; }
  select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; font-size: 13px;
  }
  #minGamesVal { color: var(--accent); font-weight: 600; min-width: 14px; display: inline-block; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tab {
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 13px;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 12px; text-align: left; white-space: nowrap; }
  th {
    min-width: 24px;
    color: var(--muted); font-weight: 600; cursor: pointer; user-select: none;
    border-bottom: 1px solid var(--border);
  }
  th.num, td.num { text-align: right; }
  th:hover { color: var(--text); }
  th.static { cursor: default; }
  th.static:hover { color: var(--muted); }
  th .arrow { color: var(--accent); font-size: 11px; }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--panel2); }
  tbody td { cursor: default; }
  tbody tr.clickable, tbody tr.clickable td { cursor: pointer; }
  td.combo { font-weight: 600; }
  .drill { color: var(--muted); font-weight: 400; }
  tbody tr.clickable:hover .drill { color: var(--accent); }
  .backbar { display: block; width: 100%; min-height: 44px; text-align: left; background: none; border: 0; padding: 8px 12px; color: var(--accent); cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border); }
  .backbar:hover { background: var(--panel2); }
  .drillhead { padding: 9px 12px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); }
  .drillhead b { color: var(--text); }
  .drillhead .w { color: var(--win); } .drillhead .l { color: var(--loss); }
  .portrait { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border);
              vertical-align: middle; margin-right: 3px; background: var(--panel2); }
  .portrait.sm { width: 22px; height: 22px; margin-right: 6px; }
  .mrec { font-weight: 400; font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .mrec .w { color: var(--win); } .mrec .l { color: var(--loss); }

  .bar { display: flex; align-items: center; gap: 8px; min-width: 150px; }
  .track { flex: 1; height: 8px; background: #2a2f3a; border-radius: 4px; overflow: hidden; min-width: 70px; }
  .fill { height: 100%; border-radius: 4px; }
  .wrnum { min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
  .wl { color: var(--muted); font-variant-numeric: tabular-nums; }
  .wl .w { color: var(--win); } .wl .l { color: var(--loss); }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  .note { color: var(--muted); font-size: 12px; margin: 10px 2px 0; }
  .pill { display: inline-block; background: var(--panel2); border: 1px solid var(--border);
          border-radius: 20px; padding: 1px 8px; font-size: 12px; margin: 1px; }
  .selrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .chip-t { background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
            border-radius: 20px; padding: 5px 13px; cursor: pointer; font-size: 13px; user-select: none;
            display: inline-block; white-space: nowrap; }
  .chip-t:hover { color: var(--text); }
  .chip-t.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip-t.disabled { opacity: .35; cursor: not-allowed; }
  .clearbtn { background: none; border: 1px solid var(--border); color: var(--muted);
              border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  .clearbtn:hover { color: var(--text); }

  /* 개인 목록은 같은 집계·정렬 결과를 PC 표와 모바일 두 줄 목록으로 표시한다. */
  .player-mobile { display: none; }
  .player-table td { padding-top: 2px; padding-bottom: 2px; }
  .player-link { display: inline-flex; align-items: center; gap: 5px; min-height: 44px;
    padding: 0; border: 0; background: none; color: var(--text); font-size: 14px;
    font-weight: 600; text-align: left; cursor: pointer; white-space: nowrap; }
  .player-link .drill { font-size: 13px; }
  .champ-strip { display: flex; align-items: center; gap: 4px; }
  .champ-trigger { display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 30px; width: 30px; min-height: 30px; padding: 0; border: 0;
    border-radius: 50%; background: var(--panel2); color: var(--text); cursor: pointer; }
  .champ-trigger .portrait { display: block; width: 30px; height: 30px; margin: 0; }
  .champ-trigger[aria-expanded="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  .champ-fallback { font-size: 12px; line-height: 1.25; white-space: normal; overflow-wrap: anywhere; }
  .champ-trigger.has-portrait .champ-fallback { display: none; }
  .champ-info { position: fixed; z-index: 10; width: 220px; max-width: calc(100vw - 24px);
    padding: 12px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 24px #0006; font-size: 13px; }
  .champ-info strong { display: block; margin-bottom: 4px; font-size: 14px; }
  .earnings { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .earnings.positive { color: var(--win); }
  .earnings.negative { color: var(--loss); }
  .earnings.neutral { color: var(--muted); }
  @media (max-width: 768px) {
    select { font-size: 16px; min-height: 44px; }
    .tab, .chip-t, .clearbtn { min-height: 44px; }
    .player-table { display: none; }
    .player-mobile { display: block; }
    .player-heading { padding: 2px 12px; border-bottom: 1px solid var(--border);
      color: var(--muted); font-size: 13px; }
    .player-heading > :not(:first-child) { text-align: right; }
    .player-heading button { min-height: 44px; padding: 0; border: 0;
      background: none; color: inherit; font-size: inherit; font-weight: 600; cursor: pointer; }
    .player-heading .arrow { color: var(--accent); font-size: 11px; }
    .player-list { list-style: none; padding: 0; margin: 0; }
    .player-item { padding: 10px 12px 12px; border-bottom: 1px solid var(--border);
      font-variant-numeric: tabular-nums; }
    .player-item:last-child { border-bottom: 0; }
    .player-primary, .player-heading { display: grid; grid-template-columns: minmax(0, 1fr) minmax(72px, max-content) minmax(52px, max-content);
      align-items: center; gap: 10px; }
    .player-primary .player-link { min-width: 0; }
    .player-rate, .player-money { display: flex; flex-direction: column; text-align: right; }
    .player-rate strong { font-size: 16px; font-weight: 600; }
    .player-rate .wl, .player-money .earnings { font-size: 13px; }
    .player-secondary { display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-top: 8px; }
    .player-champs { min-width: 0; }
    .player-champs .caption { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .player-meta { flex-shrink: 0; color: var(--muted); text-align: right; font-size: 13px; }
    .player-meta span { display: block; }
    .player-meta b { color: var(--text); font-weight: 500; }
    .champ-trigger { flex-basis: 28px; width: 28px; min-height: 28px; }
    .champ-trigger .portrait { width: 28px; height: 28px; }
  }

  /* 모바일(≤480px): 상세·다른 탭의 표는 mob 마킹된 열만 남긴다.
     헤더·조합 이름은 공백에서만 줄바꿈(keep-all) — 한글이 글자 단위로 쪼개지는 것 방지 */
  @media (max-width: 480px) {
    .wrap { padding: 16px 10px 60px; }
    .controls { gap: 10px; padding: 10px 12px; }
    .tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
    .tab { min-width: 0; padding: 5px 3px; font-size: 12px; word-break: keep-all; }
    .period { display: flex; align-items: center; width: 100%; }
    select { font-size: 16px; flex: 1; min-width: 0; }  /* 16px 미만이면 iOS Safari가 포커스 시 화면 확대 */
    th:not(.mob), td:not(.mob) { display: none; }
    th, td { padding: 7px 4px; }
    th, td.combo { white-space: normal; word-break: keep-all; }
    .bar { min-width: 0; gap: 6px; }
    .track { min-width: 30px; }
    .wrnum { min-width: 28px; font-size: 12px; }
    .wl { font-size: 12px; }
  }
</style>

<div class="wrap">
  <h1>🏟️ 투기장 시즌 전적 대시보드</h1>
  <div class="sub" id="summary"></div>

  <div class="controls">
    <div class="period">
      <label for="period">기간</label>
      <select id="period"></select>
    </div>
    <div class="selrow">
      <label>인원 선택</label>
      <span id="chips"></span>
      <button id="clearSel" class="clearbtn" hidden>초기화</button>
    </div>
    <div>
      <label for="minGames">최소 판수</label>
      <input type="range" id="minGames" min="1" max="10" value="1" />
      <span id="minGamesVal">1</span>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="panel"><div class="tablewrap"><div id="view"></div></div></div>
  <div class="note" id="note"></div>
</div>

<script>
/*
 * 대시보드 로직 (IIFE로 전역 오염 방지)
 * 흐름: 데이터 로드/파생 → 컨트롤(기간·인원·최소판수·탭) 구성 → render()가 현재 탭 계산·표시
 * state = { tab, sel(선택 인원 Set), min(최소 판수), sort(테이블별 정렬 상태) }
 */
(async function () {
  // 같은 사이트의 history_data.json을 fetch (?t= 캐시버스터로 새로고침 시 항상 최신).
  // 로컬에서 볼 땐 file:// fetch가 막히므로 정적 서버로 열 것 (python -m http.server).
  const D = await fetch("history_data.json?t=" + Date.now())
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null);
  if (!D) {
    document.getElementById("view").innerHTML =
      '<div class="empty">history_data.json 을 불러오지 못했습니다. 로컬이면 정적 서버로 여세요 (python -m http.server).</div>';
    return;
  }
  const players = D.players;                 // id -> name
  const ALL = D.games;                       // 전체 복구본 (시간순 정렬)
  const nameOf = (id) => players[id] || id;  // id를 표시 이름으로
  const ids = Object.keys(players);

  // 판마다 파생 필드(t1/t2=팀 id배열, winIds/winSet=승팀, date, season) 부여 +
  // 6시간 공백 기준으로 세션(SESS) 분리. season은 json 필드 우선, 없으면 날짜로 폴백.
  const SESS = [];
  ALL.forEach((g) => {
    g.t1 = g.team1.map((p) => p.id);
    g.t2 = g.team2.map((p) => p.id);
    g.winIds = g.winner === "team1" ? g.t1 : g.t2;
    g.winSet = new Set(g.winIds);
    g.date = g.time.slice(0, 10);
    if (g.season == null) g.season = g.date >= "2026-06-26" ? 2 : 1;
    const last = SESS[SESS.length - 1];
    if (!last || (new Date(g.time) - new Date(last[last.length - 1].time)) > 6 * 3600 * 1000) SESS.push([g]);
    else last.push(g);
  });
  const SEASONS = [...new Set(ALL.map((g) => g.season))].sort((a, b) => b - a); // 최신 먼저

  let state = { tab: "player", sel: new Set(), min: 1, sort: {} };

  // 기간 선택 (시즌은 json 필드에서 동적 생성 — 새 시즌 자동 추가)
  const periodSel = document.getElementById("period");
  const opt = (v, t) => { const o = document.createElement("option"); o.value = v; o.textContent = t; return o; };
  periodSel.appendChild(opt("all", `전체 (${ALL.length}판)`));
  SEASONS.forEach((n) => {
    const cnt = ALL.filter((g) => g.season === n).length;
    const tag = n === SEASONS[0] ? " · 진행중" : "";
    periodSel.appendChild(opt("season" + n, `시즌 ${n}${tag} (${cnt}판)`));
  });
  const og = document.createElement("optgroup"); og.label = "세션별";
  SESS.forEach((arr, i) => og.appendChild(
    opt("s" + i, `S${String(i + 1).padStart(2, "0")} ${arr[0].date} r${arr[0].round}-${arr[arr.length - 1].round} (${arr.length}판)`)));
  periodSel.appendChild(og);
  periodSel.value = SEASONS.length ? "season" + SEASONS[0] : "all"; // 기본: 최신 시즌, 빈 데이터는 전체

  /** 현재 기간 드롭다운 선택값에 해당하는 판 배열을 반환 (all / season{N} / s{세션인덱스}). */
  function pickGames() {
    const v = periodSel.value;
    if (v.startsWith("season")) return ALL.filter((g) => g.season === +v.slice(6));
    if (v[0] === "s") return SESS[+v.slice(1)];
    return ALL;
  }
  let games = pickGames();  // 현재 선택 기간의 판들 (탭 계산의 입력)

  /** 상단 요약줄(선택 기간 라벨·판수·날짜범위) 갱신. */
  function updateSummary() {
    const v = periodSel.value;
    const txt = periodSel.options[periodSel.selectedIndex].text;
    const label = v === "all" ? "전체" : v.startsWith("season") ? txt.split(" (")[0] : txt.split(" ")[0] + " 세션";
    const d0 = games.length ? games[0].date : "-", d1 = games.length ? games[games.length - 1].date : "-";
    document.getElementById("summary").innerHTML =
      `<b>${label}</b> · <b>${games.length}판</b> · ${d0 === d1 ? d0 : d0 + " ~ " + d1}`;
  }
  periodSel.onchange = () => { games = pickGames(); updateSummary(); render(); };
  updateSummary();

  // 탭별 인원 선택 최대치 (0 = 선택 사용 안 함)
  const SEL_MAX = { player: 1, pair: 2, trio: 3, matchup: 1, champ: 0 };
  const selMax = () => (state.tab in SEL_MAX ? SEL_MAX[state.tab] : 6);

  // 인원 선택 칩 (탭별 최대 인원 제한)
  const chipsEl = document.getElementById("chips");
  const clearBtn = document.getElementById("clearSel");
  const chipEls = {};
  ids.forEach((id) => {
    const c = document.createElement("button");
    c.type = "button";
    c.className = "chip-t"; c.textContent = nameOf(id);
    c.onclick = () => {
      if (c.classList.contains("disabled")) return;
      if (state.sel.has(id)) state.sel.delete(id); else state.sel.add(id);
      state.sort = {};  // 선택 변경 시 테이블 구조가 바뀔 수 있어 정렬 초기화
      refreshChips(); render();
    };
    chipEls[id] = c;
    chipsEl.appendChild(c);
  });
  clearBtn.onclick = () => { state.sel.clear(); refreshChips(); render(); };

  /** 칩의 선택(on)·비활성(disabled) 상태를 현재 탭 최대 인원에 맞춰 갱신. */
  function refreshChips() {
    const max = selMax();
    ids.forEach((id) => {
      const c = chipEls[id];
      c.classList.toggle("on", state.sel.has(id));
      // 최대치 도달 시 미선택 칩 비활성 (champ 탭은 max=0이라 전부 비활성)
      c.classList.toggle("disabled", max === 0 || (state.sel.size >= max && !state.sel.has(id)));
      c.disabled = c.classList.contains("disabled");
      c.setAttribute("aria-pressed", String(state.sel.has(id)));
    });
    clearBtn.hidden = state.sel.size === 0;
  }

  const minSlider = document.getElementById("minGames");
  const minLabel = document.getElementById("minGamesVal");
  minSlider.oninput = () => { state.min = +minSlider.value; minLabel.textContent = minSlider.value; render(); };

  // 탭 정의
  const TABS = [
    ["player", "개인"],
    ["pair", "2인 시너지"],
    ["trio", "3인 시너지"],
    ["champ", "챔피언"],
    ["matchup", "3:3 매치업"],
  ];
  const tabsEl = document.getElementById("tabs");
  TABS.forEach(([key, label]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", String(key === state.tab));
    b.className = "tab" + (key === state.tab ? " active" : "");
    b.textContent = label;
    b.onclick = () => {
      state.tab = key;
      if (state.sel.size > selMax()) state.sel.clear();  // 탭별 최대 인원 초과 시 초기화
      state.sort = {};                                   // 탭마다 기본 정렬로
      [...tabsEl.children].forEach((c) => { c.classList.remove("active"); c.setAttribute("aria-pressed", "false"); });
      b.classList.add("active");
      b.setAttribute("aria-pressed", "true");
      refreshChips();
      render();
    };
    tabsEl.appendChild(b);
  });

  // --- 조합/수치 유틸 ---
  const pairKey = (a, b) => [a, b].sort().join("|");   // 정렬로 순서 무관 페어 키
  const trioKey = (arr) => [...arr].sort().join("|");  // 정렬로 순서 무관 조합 키
  /** arr에서 k개를 뽑는 모든 조합을 반환 (재귀). */
  const combos = (arr, k) => {
    const res = [];
    const rec = (start, cur) => {
      if (cur.length === k) { res.push(cur.slice()); return; }
      for (let i = start; i < arr.length; i++) { cur.push(arr[i]); rec(i + 1, cur); cur.pop(); }
    };
    rec(0, []); return res;
  };
  const wr = (w, n) => (n ? (w / n) * 100 : 0);              // 승률(%) = 승/판
  const wrColor = (v) => `hsl(${Math.round(v * 1.2)} 62% 45%)`; // 승률→색 (0=빨강, 100=초록)

  /** id 목록을 표시용으로 정렬: 선택한 인원 먼저, 나머지는 한글 이름순. */
  const orderIds = (idList) => [...idList].sort((a, b) => {
    const sa = state.sel.has(a), sb = state.sel.has(b);
    if (sa !== sb) return sa ? -1 : 1;
    return nameOf(a).localeCompare(nameOf(b), "ko");
  });
  const teamName = (idList) => orderIds(idList).map(nameOf).join("+"); // 팀 조합 표시 문자열

  // 챔피언 초상화 (Data Dragon, 로드 실패 시 초상화 없이 동작)
  let CHAMP_IMG = null; // 한글 챔프명 -> 이미지 URL
  (async () => {
    try {
      const ver = (await (await fetch("https://ddragon.leagueoflegends.com/api/versions.json")).json())[0];
      const cd = (await (await fetch(`https://ddragon.leagueoflegends.com/cdn/${ver}/data/ko_KR/champion.json`)).json()).data;
      CHAMP_IMG = {};
      Object.values(cd).forEach((c) => {
        CHAMP_IMG[c.name] = `https://ddragon.leagueoflegends.com/cdn/${ver}/img/champion/${c.id}.png`;
      });
      render(); // 로드 완료 후 초상화 반영
    } catch (e) { /* 오프라인 등 - 텍스트만 표시 */ }
  })();
  /** 챔프명 → 초상화 <img> HTML. 이미지 미로드 시 빈 문자열(텍스트만). @param cls 추가 클래스 @param title 툴팁 */
  const portrait = (champ, cls, title) => CHAMP_IMG && CHAMP_IMG[champ]
    ? `<img class="portrait ${cls || ""}" src="${CHAMP_IMG[champ]}" alt="${champ}" title="${title || champ}" loading="lazy">`
    : "";

  const escapeHTML = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const earnings = (r) => {
    const man = (2 * r.w - r.n) * 0.5;
    return `<span class="earnings ${man > 0 ? "positive" : man < 0 ? "negative" : "neutral"}">${man > 0 ? "+" : ""}${Number.isInteger(man) ? man : man.toFixed(1)}만</span>`;
  };
  // 모바일과 PC 모두 title/hover 없이도 같은 챔피언 정보를 확인할 수 있다.
  const topChampions = (r) => r.top5.map(([champ, s]) => {
    const img = CHAMP_IMG && CHAMP_IMG[champ];
    return `<button type="button" class="champ-trigger${img ? " has-portrait" : ""}"
      aria-label="${escapeHTML(champ)} 전적" aria-controls="champ-info" aria-expanded="false"
      data-champ="${escapeHTML(champ)}" data-w="${s.w}" data-n="${s.n}">
      ${img ? `<img class="portrait" src="${escapeHTML(img)}" alt="" loading="lazy">` : ""}
      <span class="champ-fallback">${escapeHTML(champ)}</span></button>`;
  }).join("") || '<span class="drill">기록 없음</span>';

  const champInfo = document.createElement("div");
  champInfo.id = "champ-info";
  champInfo.className = "champ-info";
  champInfo.setAttribute("role", "status");
  champInfo.hidden = true;
  document.body.appendChild(champInfo);
  let champTrigger = null;
  function closeChampInfo() {
    if (champTrigger) champTrigger.setAttribute("aria-expanded", "false");
    champTrigger = null;
    champInfo.hidden = true;
  }
  function showChampInfo(button) {
    if (champTrigger === button) { closeChampInfo(); return; }
    closeChampInfo();
    champTrigger = button;
    const w = +button.dataset.w, n = +button.dataset.n;
    champInfo.innerHTML = `<strong>${escapeHTML(button.dataset.champ)}</strong>
      <span class="wl"><span class="w">${w}승</span> <span class="l">${n - w}패</span></span> · ${wr(w, n).toFixed(0)}% · ${n}판`;
    champInfo.hidden = false;
    button.setAttribute("aria-expanded", "true");
    const rect = button.getBoundingClientRect();
    const box = champInfo.getBoundingClientRect();
    const left = Math.max(12, Math.min(rect.left, document.documentElement.clientWidth - box.width - 12));
    const top = rect.bottom + box.height + 20 < innerHeight ? rect.bottom + 8 : Math.max(12, rect.top - box.height - 8);
    champInfo.style.left = left + "px";
    champInfo.style.top = top + "px";
  }
  document.addEventListener("click", (event) => {
    if (!event.target.closest(".champ-trigger, .champ-info")) closeChampInfo();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && champTrigger) {
      const button = champTrigger;
      closeChampInfo();
      button.focus({ preventScroll: true });
    }
  });
  document.addEventListener("focusin", (event) => {
    if (champTrigger && event.target !== champTrigger) closeChampInfo();
  });
  window.addEventListener("resize", closeChampInfo);
  document.addEventListener("scroll", closeChampInfo, true);
  function bindChampions(view) {
    view.querySelectorAll(".champ-trigger").forEach((button) => {
      button.onclick = (event) => { event.stopPropagation(); showChampInfo(button); };
      const img = button.querySelector("img");
      if (img) {
        const fallback = () => { img.remove(); button.classList.remove("has-portrait"); };
        img.onerror = fallback;
        if (img.complete && !img.naturalWidth) fallback();
      }
    });
  }

  // --- 셀 렌더 ---
  /** 승/패 텍스트 + 승률 막대바 + 퍼센트를 담은 <td>를 반환. */
  function barCell(w, n) {
    const v = wr(w, n);
    return `<td><div class="bar">
      <span class="wl"><span class="w">${w}</span>승 <span class="l">${n - w}</span>패</span>
      <div class="track"><div class="fill" style="width:${v}%;background:${wrColor(v)}"></div></div>
      <span class="wrnum">${v.toFixed(0)}%</span>
    </div></td>`;
  }

  // --- 정렬 가능한 테이블 렌더러 ---
  /**
   * 정렬 가능한 표를 #view(또는 지정 id)에 그린다.
   * @param id       렌더 대상 요소 id 겸 정렬 상태 키 (state.sort[id]).
   * @param cols     컬럼 정의 [{ label, num(우측정렬·숫자정렬), mob(모바일 표시), sortable(false이면 정렬 불가), val(row)=>정렬값, cell(row)=>'<td>..</td>' }].
   * @param rows     표시할 행 배열 (제자리 정렬됨; 동률이면 row._n 큰 순 보조 정렬).
   * @param defSort  기본 정렬 { col, dir:'asc'|'desc' } (해당 id에 정렬 상태가 없을 때 적용).
   * @param onRow    (선택) 행 클릭 콜백. 있으면 tr에 clickable + 클릭 핸들러 부착.
   */
  function table(id, cols, rows, defSort, onRow) {
    const st = state.sort[id] || (state.sort[id] = { col: defSort.col, dir: defSort.dir });
    if (st.col >= cols.length || cols[st.col].sortable === false) { st.col = defSort.col; st.dir = defSort.dir; }
    rows.sort((a, b) => {
      const va = cols[st.col].val(a), vb = cols[st.col].val(b);
      let c = typeof va === "string" ? va.localeCompare(vb) : va - vb;
      if (c === 0) { // 동률이면 판수 많은 순 보조 정렬
        const na = a._n || 0, nb = b._n || 0; c = na - nb;
      }
      return st.dir === "asc" ? c : -c;
    });
    let html = "<table><thead><tr>";
    cols.forEach((col, i) => {
      const arrow = i === st.col ? ` <span class="arrow">${st.dir === "asc" ? "▲" : "▼"}</span>` : "";
      const sorting = col.sortable === false ? '' : `tabindex="0" aria-sort="${i === st.col ? (st.dir === "asc" ? "ascending" : "descending") : "none"}" data-c="${i}"`;
      html += `<th scope="col" ${sorting} class="${col.num ? "num" : ""} ${col.sortable === false ? "static" : ""}">${col.label}${arrow}</th>`;
    });
    html += "</tr></thead><tbody>";
    if (!rows.length) {
      html += `<tr><td colspan="${cols.length}" class="empty mob">최소 판수 조건을 만족하는 데이터가 없습니다.</td></tr>`;
    } else {
      rows.forEach((r) => { html += `<tr class="${onRow ? "clickable" : ""}">` + cols.map((c) => c.cell(r)).join("") + "</tr>"; });
    }
    html += "</tbody></table>";
    const view = document.getElementById(id);
    view.innerHTML = html;
    // 모바일 표시 열 마킹 — cols[i].mob 이면 .mob 부여, 나머지는 ≤480px에서 CSS로 숨김
    view.querySelectorAll("tr").forEach((tr) =>
      [...tr.children].forEach((c, i) => { if (cols[i] && cols[i].mob) c.classList.add("mob"); }));
    view.querySelectorAll("th[data-c]").forEach((th) => {
      th.onclick = () => {
        const c = +th.dataset.c;
        if (st.col === c) st.dir = st.dir === "asc" ? "desc" : "asc";
        else { st.col = c; st.dir = cols[c].num ? "desc" : "asc"; }
        render();
        document.querySelector(`#${id} th[data-c="${c}"]`)?.focus({ preventScroll: true });
      };
      th.onkeydown = (event) => {
        if (event.key === "Enter" || event.key === " ") { event.preventDefault(); th.click(); }
      };
    });
    if (onRow) view.querySelectorAll("tbody tr").forEach((tr, i) => {
      if (rows[i]) tr.onclick = (event) => { if (!event.target.closest("button")) onRow(rows[i]); };
    });
    return { cols, st };
  }

  let playerOverviewSort = null;
  let returningPlayer = null;
  const PLAYER_WINRATE_COL = 4;
  function openPlayer(id) {
    playerOverviewSort = { ...state.sort.view };
    returningPlayer = id;
    state.sel = new Set([id]); state.sort = {}; refreshChips(); render();
    document.querySelector(".backbar")?.focus({ preventScroll: true });
  }

  function renderPlayerMobile(rows, st) {
    const view = document.getElementById("view");
    view.querySelector("table").classList.add("player-table");
    view.insertAdjacentHTML("beforeend", `<section class="player-mobile" aria-label="플레이어 전적">
      <div class="player-heading">
        <span>플레이어</span>
        <button type="button" id="player-winrate-sort" aria-label="승률 ${st.dir === "desc" ? "내림차순, 오름차순으로 변경" : "오름차순, 내림차순으로 변경"}">승률 <span class="arrow" aria-hidden="true">${st.dir === "asc" ? "▲" : "▼"}</span></button>
        <span>번 돈</span>
      </div>
      <ul class="player-list">${rows.map((r) => `<li class="player-item">
        <div class="player-primary">
          <button type="button" class="player-link" data-player="${r.id}" aria-label="${escapeHTML(r.name)} 챔피언별 전적">${escapeHTML(r.name)} <span class="drill" aria-hidden="true">›</span></button>
          <div class="player-rate"><strong aria-label="승률 ${wr(r.w, r.n).toFixed(0)}퍼센트">${wr(r.w, r.n).toFixed(0)}%</strong>
            <span class="wl"><span class="w">${r.w}</span>승 <span class="l">${r.n - r.w}</span>패</span></div>
          <div class="player-money">${earnings(r)}</div>
        </div>
        <div class="player-secondary">
          <div class="player-champs"><span class="caption">주력 챔프 TOP5</span><div class="champ-strip">${topChampions(r)}</div></div>
          <div class="player-meta"><span><b>${r.n}</b>판</span><span>챔프 <b>${r.champN}</b>종</span></div>
        </div>
      </li>`).join("") || '<li class="empty">플레이어 데이터가 없습니다.</li>'}</ul>
    </section>`);
    document.getElementById("player-winrate-sort").onclick = () => {
      st.col = PLAYER_WINRATE_COL;
      st.dir = st.dir === "asc" ? "desc" : "asc";
      render();
      document.getElementById("player-winrate-sort").focus({ preventScroll: true });
    };
    view.querySelectorAll("[data-player]").forEach((button) => {
      button.onclick = () => openPlayer(button.dataset.player);
    });
    bindChampions(view);
  }

  /** 조합(idList)이 선택한 인원을 모두 포함하는지 (2명 고르면 그 2명 낀 조합 전부 통과). */
  const selMatch = (idList) => {
    for (const s of state.sel) if (!idList.includes(s)) return false;
    return true;
  };

  // ================= 각 탭 계산 =================
  /**
   * 챔프별 픽 수·승수 집계. pred(픽 필터)가 있으면 해당 픽만 세고, 없으면 전체.
   * @return [{ champ, n(픽), w(승), _n }] (최소 판수 필터 적용).
   */
  function champData(pred) {
    const map = new Map();
    games.forEach((g) => {
      [ [g.team1, g.winner === "team1"], [g.team2, g.winner === "team2"] ].forEach(([team, won]) => {
        team.forEach((p) => {
          if (pred && !pred(p)) return;
          let e = map.get(p.champ);
          if (!e) { e = { champ: p.champ, n: 0, w: 0 }; map.set(p.champ, e); }
          e.n++; if (won) e.w++;
        });
      });
    });
    return [...map.values()].filter((e) => e.n >= state.min).map((e) => ({ ...e, _n: e.n }));
  }
  /** 챔프 표의 공통 컬럼 정의(초상화+이름 / 픽 / 승률). @param firstLabel 첫 컬럼 헤더. */
  const champCols = (firstLabel) => [
    { label: firstLabel, num: false, mob: true, val: (r) => r.champ, cell: (r) => `<td class="combo">${portrait(r.champ, "sm")}${r.champ}</td>` },
    { label: "픽", num: true, mob: true, val: (r) => r.n, cell: (r) => `<td class="num">${r.n}</td>` },
    { label: "승률", num: true, mob: true, val: (r) => wr(r.w, r.n), cell: (r) => barCell(r.w, r.n) },
  ];

  /**
   * 개인 탭. 미선택 시: 6명 승률표(판/고유챔프수/주력TOP5/승률/번 돈, 행 클릭 시 드릴다운).
   * 인원 선택 시: 그 사람의 챔프별 승률(픽 순) + 상단에 요약 헤더와 뒤로가기.
   */
  function renderPlayer() {
    // 인원 선택 시: 그 사람(들)의 챔프별 승률로 드릴다운 (픽 순 정렬)
    if (state.sel.size) {
      const who = [...state.sel].map(nameOf).join(", ");
      // 선택 인원의 고유 챔프 수 / 승패 (min 필터 무관)
      const champSet = new Set(); let picks = 0, wins = 0;
      games.forEach((g) => {
        g.team1.concat(g.team2).forEach((p) => {
          if (state.sel.has(p.id)) { champSet.add(p.champ); picks++; if (g.winSet.has(p.id)) wins++; }
        });
      });
      table("view", champCols(who + " 챔프"), champData((p) => state.sel.has(p.id)), { col: 1, dir: "desc" });
      const view = document.getElementById("view");
      const head = document.createElement("div");
      head.className = "drillhead";
      head.innerHTML = `${who} · ${picks}판 · 플레이 챔프 <b>${champSet.size}종</b> · <span class="w">${wins}</span>승 <span class="l">${picks - wins}</span>패`;
      view.insertBefore(head, view.firstChild);
      const back = document.createElement("button");
      back.type = "button";
      back.className = "backbar";
      back.textContent = "‹ 전체 플레이어로";
      back.onclick = () => {
        state.sel.clear(); state.sort = playerOverviewSort ? { view: { ...playerOverviewSort } } : {};
        refreshChips(); render();
        [...document.querySelectorAll("[data-player]")].find((button) =>
          button.dataset.player === returningPlayer && button.getClientRects().length)?.focus({ preventScroll: true });
      };
      view.insertBefore(back, view.firstChild);
      return;
    }
    const rows = ids.map((id) => {
      let w = 0; const cs = {}; // champ -> {n, w}
      games.forEach((g) => {
        const won = g.winSet.has(id);
        if (won) w++;
        g.team1.concat(g.team2).forEach((p) => {
          if (p.id !== id) return;
          const e = cs[p.champ] || (cs[p.champ] = { n: 0, w: 0 });
          e.n++; if (won) e.w++;
        });
      });
      // 주력 TOP5: 승수 많은 순 (판수 x 승률의 조합), 동률이면 판수 -> 승률
      const top5 = Object.entries(cs)
        .sort((a, b) => b[1].w - a[1].w || b[1].n - a[1].n || wr(b[1].w, b[1].n) - wr(a[1].w, a[1].n))
        .slice(0, 5);
      return { id, name: nameOf(id), n: games.length, w, champN: Object.keys(cs).length, top5, _n: games.length };
    });
    const { st } = table("view",
      [
        { label: "플레이어", num: false, mob: true, val: (r) => r.name, cell: (r) => `<td class="combo"><button type="button" class="player-link" data-player="${r.id}" aria-label="${escapeHTML(r.name)} 챔피언별 전적">${escapeHTML(r.name)} <span class="drill" aria-hidden="true">챔프 ›</span></button></td>` },
        { label: "판", num: true, mob: true, val: (r) => r.n, cell: (r) => `<td class="num">${r.n}</td>` },
        { label: "플레이 챔프 수", num: true, val: (r) => r.champN, cell: (r) => `<td class="num">${r.champN}</td>` },
        { label: "주력 챔프 TOP5", num: false, val: (r) => r.top5.length, cell: (r) =>
          `<td><div class="champ-strip">${topChampions(r)}</div></td>` },
        { label: "승률", num: true, mob: true, val: (r) => wr(r.w, r.n), cell: (r) => barCell(r.w, r.n) },
        { label: "번 돈", num: true, mob: true, val: (r) => 2 * r.w - r.n, cell: (r) => `<td class="num">${earnings(r)}</td>` },
      ].map((col, i) => ({ ...col, sortable: i === PLAYER_WINRATE_COL })),
      rows, { col: PLAYER_WINRATE_COL, dir: "desc" },
      (r) => openPlayer(r.id));
    renderPlayerMobile(rows, st);
  }

  /**
   * 2인/3인 시너지 탭. 같은 팀이었던 k인 조합의 승률을 집계.
   * @param k 조합 크기 (2=페어, 3=트리오). 선택 인원을 모두 포함하는 조합만 표시.
   */
  function renderCombo(k) {
    const map = new Map(); // key -> {ids, n, w}
    games.forEach((g) => {
      [ [g.t1, g.winner === "team1"], [g.t2, g.winner === "team2"] ].forEach(([team, won]) => {
        combos(team, k).forEach((c) => {
          const key = trioKey(c);
          let e = map.get(key);
          if (!e) { e = { ids: [...c].sort(), n: 0, w: 0 }; map.set(key, e); }
          e.n++; if (won) e.w++;
        });
      });
    });
    let rows = [...map.values()]
      .filter((e) => e.n >= state.min && selMatch(e.ids))
      .map((e) => ({ ...e, name: orderIds(e.ids).map(nameOf).join(" + "), _n: e.n }));
    table("view",
      [
        { label: "조합", num: false, mob: true, val: (r) => r.name, cell: (r) => `<td class="combo">${r.name}</td>` },
        { label: "판", num: true, mob: true, val: (r) => r.n, cell: (r) => `<td class="num">${r.n}</td>` },
        { label: "같은 팀일 때 승률", num: true, mob: true, val: (r) => wr(r.w, r.n), cell: (r) => barCell(r.w, r.n) },
      ],
      rows, { col: 2, dir: "desc" });
  }

  /** 챔피언 탭. 인원 선택과 무관하게 챔프별 전체 픽 수·승률 (픽 순 정렬). */
  function renderChamp() {
    table("view", champCols("챔피언"), champData(null), { col: 1, dir: "desc" });
  }

  /**
   * 3:3 매치업 탭. 2번 이상 반복된 같은 3:3 구도만 집계.
   * canonical 키로 파티션을 dedup하고, 인원 1명 선택 시 그 사람 팀을 왼쪽(A)으로 고정.
   */
  function renderMatchup() {
    const map = new Map(); // canonicalKey -> {a, b, n, aw, bw}  (a=id정렬상 작은 팀)
    games.forEach((g) => {
      const t1 = [...g.t1].sort(), t2 = [...g.t2].sort();
      const k1 = t1.join("|"), k2 = t2.join("|");
      const aIsT1 = k1 < k2;
      const [a, b, key] = aIsT1 ? [t1, t2, k1 + " vs " + k2] : [t2, t1, k2 + " vs " + k1];
      const aWon = aIsT1 ? g.winner === "team1" : g.winner === "team2";
      let e = map.get(key);
      if (!e) { e = { a, b, n: 0, aw: 0, bw: 0 }; map.set(key, e); }
      e.n++; if (aWon) e.aw++; else e.bw++;
    });
    const focus = state.sel.size === 1 ? [...state.sel][0] : null;
    let rows = [...map.values()]
      .filter((e) => e.n >= Math.max(2, state.min))
      .map((e) => {
        // 인원 선택 시 그 사람 팀을 왼쪽으로 고정
        const flip = focus && e.b.includes(focus);
        const a = flip ? e.b : e.a, b = flip ? e.a : e.b;
        const aw = flip ? e.bw : e.aw, bw = flip ? e.aw : e.bw;
        return { n: e.n, _n: e.n, aw, bw,
          aName: teamName(a), bName: teamName(b) };
      });
    // 팀 조합 + 그 팀 기준 전적/승률을 한 셀에 (아래줄)
    const teamCell = (name, w, n) => {
      const v = wr(w, n);
      return `<td class="combo">${name}<div class="mrec"><span class="w">${w}승</span> <span class="l">${n - w}패</span> <span style="color:${wrColor(v)}">(${v.toFixed(0)}%)</span></div></td>`;
    };
    table("view",
      [
        { label: "판", num: true, mob: true, val: (r) => r.n, cell: (r) => `<td class="num">${r.n}</td>` },
        { label: focus ? nameOf(focus) + " 팀" : "A팀", num: false, mob: true, val: (r) => wr(r.aw, r.n), cell: (r) => teamCell(r.aName, r.aw, r.n) },
        { label: focus ? "상대팀" : "B팀", num: false, mob: true, val: (r) => wr(r.bw, r.n), cell: (r) => teamCell(r.bName, r.bw, r.n) },
      ],
      rows, { col: focus ? 1 : 0, dir: "desc" });
  }

  // 탭별 하단 안내 문구 (표 아래 .note에 표시)
  const NOTES = {
    player: "주력 챔프 TOP5는 승수 많은 순입니다. <b>초상화를 누르면 전적</b>, <b>플레이어 이름을 누르면 챔피언별 상세</b>를 볼 수 있습니다. '번 돈'은 선택한 기간의 승 +5,000원 / 패 -5,000원 정산입니다.",
    pair: "두 명이 <b>같은 팀</b>이었던 판의 시너지 승률. 인원은 <b>2명까지</b>(1명이면 그 사람의 모든 페어).",
    trio: "세 명이 한 팀을 이뤘을 때 승률. 인원은 <b>3명까지</b> — 2명만 골라도 그 2명이 낀 트리오가 전부 나옵니다.",
    champ: "챔프별 전체 픽 수·승률 (인원 선택 사용 안 함).",
    matchup: "같은 3:3 구도가 2번 이상 반복된 경우만. 각 팀 아래는 그 팀 기준 전적. <b>인원 1명 선택 시 그 사람 팀이 왼쪽으로 고정</b>돼 '내 팀 vs 상대팀'으로 읽힘.",
  };

  /** 현재 state.tab에 맞는 렌더 함수를 호출 (모든 컨트롤 변경의 최종 진입점). */
  function render() {
    closeChampInfo();
    document.getElementById("note").innerHTML = NOTES[state.tab] || "";
    if (state.tab === "player") renderPlayer();
    else if (state.tab === "pair") renderCombo(2);
    else if (state.tab === "trio") renderCombo(3);
    else if (state.tab === "champ") renderChamp();
    else if (state.tab === "matchup") renderMatchup();
  }

  render();
})();
</script>
</html>
